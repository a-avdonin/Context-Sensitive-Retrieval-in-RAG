data_dir: data/mt-rag-benchmark
cache_dir: cache
runs_dir: runs

retrieval:
  top_k: 10
  first_stage_k: 100
  rrf_k: 60

dense:
  model: BAAI/bge-base-en-v1.5
  query_prefix: "Represent this sentence for searching relevant passages: "
  batch_size: 128
  device: null  # cuda / cpu / null = auto

reranker:
  model: BAAI/bge-reranker-v2-m3
  candidates: 50
  batch_size: 32

llm:
  base_url: http://localhost:8000/v1  # переопределяется LLM_BASE_URL
  rewrite_model: qwen3.8-27b
  router_model: qwen3.8-27b
  generator_model: gemma-4-26b-a4b-it
  judge_model: laya
  temperature: 0.0
  max_history_turns: 6

eval:
  k_values: [1, 3, 5, 10]
  oracle_metric: ndcg_cut_5
